<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a68"/>
      <stop offset="1" stop-color="#3a7dcf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#g)"/>
  <!-- Emoji enfant rendu via la police emoji du système (Apple, Segoe, Noto) -->
  <text x="32" y="34" font-size="44"
        text-anchor="middle" dominant-baseline="central"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, EmojiOne Color, Symbola, sans-serif">🧒</text>
  <!-- Pastille blanche + symbole d'accessibilité en bas à droite, plus petit -->
  <circle cx="50" cy="50" r="11" fill="#ffffff"/>
  <text x="50" y="51.5" font-size="14"
        text-anchor="middle" dominant-baseline="central"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, EmojiOne Color, Symbola, sans-serif">♿</text>
</svg>
